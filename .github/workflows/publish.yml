name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Build
        run: |
          bun install
          bun run build
      - name: Publish
        run: |
          unset NPM_CONFIG_USERCONFIG
          unset NODE_AUTH_TOKEN
          rm -f .npmrc
          npx -p npm@latest npm publish --registry=https://registry.npmjs.org/ --access public --provenance
