name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Build & Publish
        run: |
          bun install
          bun run build
          npm publish --access public --provenance
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
