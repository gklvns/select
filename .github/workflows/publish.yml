name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Build & Publish
        run: |
          bun install
          bun run build
          export XDG_CONFIG_HOME="$HOME"
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > $XDG_CONFIG_HOME/.npmrc
          bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
